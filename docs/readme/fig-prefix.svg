</style><rect x="0" y="0" width="680" height="200" fill="#ffffff"/><text class="d-t d-b" x="22" y="20" text-anchor="start">一个执行会话的上下文，从前往后</text><path class="d-e" d="M22 46 H436"/><path class="d-e" d="M22 46 V54"/><path class="d-e" d="M436 46 V54"/><text class="d-a" x="229" y="40" text-anchor="middle">稳定的前缀：每次唤醒都能命中缓存</text><path class="d-e" d="M446 46 H658"/><path class="d-e" d="M446 46 V54"/><path class="d-e" d="M658 46 V54"/><text class="d-m" x="552" y="40" text-anchor="middle">每次唤醒只在末尾追加</text><rect class="d-n" x="22.0" y="60.0" width="112" height="36" rx="6"/><text class="d-t" x="78" y="82.5" text-anchor="middle">系统提示</text><rect class="d-ctx" x="138.0" y="60.0" width="168" height="36" rx="6"/><text class="d-t" x="222" y="82.5" text-anchor="middle">角色说明（开会话时冻结）</text><rect class="d-n" x="308.0" y="60.0" width="128" height="36" rx="6"/><text class="d-t" x="372" y="82.5" text-anchor="middle">之前的回合</text><rect class="d-n" x="446.0" y="60.0" width="98" height="36" rx="6"/><text class="d-t" x="495" y="82.5" text-anchor="middle">唤醒通知</text><rect class="d-n" x="550.0" y="60.0" width="108" height="36" rx="6"/><text class="d-t" x="604" y="82.5" text-anchor="middle">拉取的条目</text><path class="d-e" d="M446 112 H664" marker-end="url(#ar-prefix)"/><text class="d-m" x="552" y="130" text-anchor="middle">新内容从这里往后加</text><rect class="d-n" x="30.0" y="156.0" width="280" height="32" rx="6"/><text class="d-t" x="170" y="176.5" text-anchor="middle">同一件事 → 续接同一个会话</text><rect class="d-n" x="350.0" y="156.0" width="300" height="32" rx="6"/><text class="d-t" x="500" y="176.5" text-anchor="middle">项目设置变了 → 开新会话，重新冻结</text></svg>