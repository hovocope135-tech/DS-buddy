<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" role="img" aria-label="prefix"><defs><marker id="ar-prefix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-h" d="M0 0L10 5L0 10z"/></marker><marker id="ar-prefixs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="d-h" d="M10 0L0 5L10 10z"/></marker></defs><style>
